name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck bin/capsule test/capsule-test.sh test/capsuled-test.sh
      - run: shellcheck -s sh src/assets/hooks/*.sh src/assets/statusline.sh
      - run: bash test/capsule-test.sh

  zig:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      # zig 0.16 writes a zip dependency into $ZIG_GLOBAL_CACHE_DIR/tmp without
      # creating that directory first, so on a cold runner the sqlite amalgamation
      # fetch dies with "failed to create temporary zip file: FileNotFound".
      - run: mkdir -p ~/.cache/zig/tmp
      - run: nix develop --command zig fmt --check src build.zig
      - run: nix develop --command zig build test
      - run: nix develop --command sh -c 'zig build && bash test/capsuled-test.sh'
      - run: nix build .#capsuled
