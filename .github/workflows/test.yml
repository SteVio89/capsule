name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck test/capsuled-test.sh
      # The container's contract is POSIX sh plus curl, jq and just — nothing bash-only,
      # because these run inside the image and not on the host. handoff.sh was missing
      # from this list until the shell CLI it lived beside was deleted.
      - run: shellcheck -s sh src/assets/hooks/*.sh src/assets/statusline.sh src/assets/handoff.sh

  zig:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      # zig 0.16 writes a zip dependency into $ZIG_GLOBAL_CACHE_DIR/tmp without
      # creating that directory first, so on a cold runner the sqlite amalgamation
      # fetch dies with "failed to create temporary zip file: FileNotFound".
      - run: mkdir -p ~/.cache/zig/tmp
      - run: nix develop --command zig fmt --check src build.zig
      - run: nix develop --command zig build test
      - run: nix develop --command sh -c 'zig build && bash test/capsuled-test.sh'
      - run: nix build .#capsule
